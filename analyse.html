<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analize Match - PREZI SCORE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h2>⬅️ Analize Match</h2>
</header>

<div class="teams">

  <div class="team">
    <img id="home-logo" src="" width="70">
    <h3 id="home-team">United States U20</h3>
  </div>

  <div class="score">
    <h1 id="score">1 - 0</h1>
    <p id="minute">⏱ 45'</p>
  </div>

  <div class="team">
    <img id="away-logo" src="" width="70">
    <h3 id="away-team">Haiti U20</h3>
  </div>

</div>

<div class="menu-stats">

<button>📋 Match</button>
<button>📊 Stats</button>
<button>👥 Lineup</button>
<button>⚽ Evènman</button>
<button>🤖 AI</button>

</div>

<div class="stats">

<h3>📊 Estatistik</h3>

<p>Expected Goals (xG)</p>
<progress value="70" max="100"></progress>

<p>Posesyon</p>
<progress value="47" max="100"></progress>

<p>Tir</p>
<progress value="64" max="100"></progress>

<p>Tir sou sib</p>
<progress value="63" max="100"></progress>

<p>Pase</p>
<progress value="91" max="100"></progress>

</div>

<script src="script.js"></script>

</body>
</html>
