<script>


const LIVE_API =
"https://v3.football.api-sports.io/fixtures?live=all";


async function loadLiveMatches(){


const box =
document.getElementById("live-list");



try{


const response =
await fetch(
LIVE_API,
{

headers:{

"x-apisports-key":API_KEY

}

});



const data =
await response.json();



box.innerHTML="";



if(!data.response || data.response.length===0){


box.innerHTML =
"⚽ Pa gen match live kounye a";


return;


}



data.response
.slice(0,20)
.forEach(match=>{


let home =
match.teams.home.name;


let away =
match.teams.away.name;


let score =
`${match.goals.home ?? 0} - ${match.goals.away ?? 0}`;


let minute =
match.fixture.status.elapsed
?
match.fixture.status.elapsed+"'"
:
"--";



let league =
match.league.name;



box.innerHTML += `


<div class="match-item">


<h4>
🏆 ${league}
</h4>


<span class="live-badge">
🔴 LIVE
</span>


<p>
⚪ ${home}
</p>


<strong>
${score}
</strong>


<p>
🔵 ${away}
</p>


<p>
⏱️ ${minute}
</p>



<button onclick="openMatch(
'${home}',
'${away}',
'${score}',
'${league}',
'${minute}'
)">

📊 Analize Match

</button>



</div>


`;



});



}


catch(error){


console.log(error);


box.innerHTML =
"❌ Erè koneksyon Live";


}



}



loadLiveMatches();


</script>
