<script src="api.js"></script>


<script>


async function loadMatchPage(){


const box =
document.getElementById("matches-list");


try{


const today =
new Date()
.toISOString()
.split("T")[0];



const response =
await fetch(
`https://v3.football.api-sports.io/fixtures?date=${today}`,
{


headers:{

"x-apisports-key":API_KEY

}


});



const data =
await response.json();



box.innerHTML="";



data.response
.slice(0,20)
.forEach(match=>{


let home =
match.teams.home.name;


let away =
match.teams.away.name;


let score =
`${match.goals.home ?? 0} - ${match.goals.away ?? 0}`;


let minute =
match.fixture.status.elapsed
?
match.fixture.status.elapsed+"'"
:
"--";



let league =
match.league.name;



box.innerHTML += `


<div class="match-item">


<h4>
🏆 ${league}
</h4>


<p>
⚪ ${home}
</p>


<strong>
${score}
</strong>


<p>
🔵 ${away}
</p>


<p>
⏱️ ${minute}
</p>


<button onclick="openMatch(
'${home}',
'${away}',
'${score}',
'${league}',
'${minute}'
)">

📊 Analize Match

</button>


</div>


`;



});



}

catch(error){


box.innerHTML =
"❌ Erè chajman match yo";


console.log(error);


}


}



loadMatchPage();


</script>
